name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci --include=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

  build-and-e2e:
    name: Build + E2E (needs a live backend)
    runs-on: ubuntu-latest
    # The Next.js build statically prerenders pages (e.g. /account) that
    # call the backend's public settings endpoint at build time — this
    # job needs the backend repo checked out and running before `npm run
    # build`, not just before the E2E tests. See docs/RUNBOOK.md for the
    # same coupling in local dev.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: zurie_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: frontend

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          # Requires a PAT with read access to zurie_backend, stored as
          # this repo's BACKEND_REPO_TOKEN secret — GITHUB_TOKEN alone
          # can't check out a second, separate repository.
          repository: DaddyWilly-8/zurie_backend
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: backend

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_mysql

      - uses: actions/setup-node@v4
        with:
          node-version-file: "frontend/.nvmrc"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: Configure backend .env
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i "s/^DB_HOST=.*/DB_HOST=127.0.0.1/" .env
          sed -i "s/^DB_DATABASE=.*/DB_DATABASE=zurie_ci/" .env
          sed -i "s/^DB_USERNAME=.*/DB_USERNAME=root/" .env
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=/" .env
          echo "SANCTUM_STATEFUL_DOMAINS=localhost,localhost:3000,127.0.0.1,127.0.0.1:8000" >> .env

      - name: Migrate and seed backend
        working-directory: backend
        run: |
          php artisan migrate --force
          php artisan db:seed --class=PermissionSeeder --force
          php artisan db:seed --class=RoleSeeder --force
          php artisan db:seed --class=ChartOfAccountsSeeder --force
          php artisan db:seed --class=CurrencySeeder --force
          php artisan db:seed --class=SalesOutletSeeder --force

      - name: Seed E2E fixtures (admin user, product, coupon)
        working-directory: backend
        run: php artisan tinker --execute="
          \$role = \App\Modules\Auth\Models\Role::where('name','admin')->first();
          \$user = \App\Modules\Auth\Models\User::firstOrCreate(['email'=>'e2e-admin@test.local'],['name'=>'E2E Admin','password'=>bcrypt('e2e-test-password-123')]);
          \$user->roles()->syncWithoutDetaching([\$role->id]);
          \$categoryId = \App\Modules\Product\Models\Category::firstOrCreate(['slug'=>'e2e-fixture-category'],['name'=>'E2E Fixture Category','visible'=>true])->id;
          \$productId = \Illuminate\Support\Facades\DB::table('products')->where('sku','E2E-FIXTURE-PRODUCT')->value('id');
          if (!\$productId) {
            \$productId = \Illuminate\Support\Facades\DB::table('products')->insertGetId(['name'=>'E2E Fixture Product','slug'=>'e2e-fixture-product','category_id'=>\$categoryId,'sku'=>'E2E-FIXTURE-PRODUCT','buying_price'=>500,'price'=>1000,'status'=>'published','featured'=>0,'best_seller'=>0,'new_arrival'=>0,'created_at'=>now(),'updated_at'=>now()]);
            app(\App\Modules\Inventory\Services\InventoryService::class)->provisionForProduct(\$productId);
          }
          \Illuminate\Support\Facades\DB::table('inventory')->where('product_id',\$productId)->update(['quantity'=>500,'stock_status'=>'IN_STOCK']);
          \Illuminate\Support\Facades\DB::table('coupons')->updateOrInsert(['code'=>'E2EFIXTURE'],['type'=>'fixed','value'=>100,'min_order_amount'=>0,'max_uses'=>10000,'used_count'=>0,'is_active'=>1,'created_at'=>now(),'updated_at'=>now()]);
          echo 'fixtures ready: product '.\$productId.PHP_EOL;
          "

      - name: Start backend
        working-directory: backend
        run: php artisan serve --port=8000 &

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --include=dev

      - name: Configure frontend .env.local
        working-directory: frontend
        run: echo "NEXT_PUBLIC_API_ORIGIN=http://127.0.0.1:8000" > .env.local

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
